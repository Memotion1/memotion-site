# Publishes the website to one.com every time something changes in this repository
# (for example when you press Save in the admin panel). Takes about 1–2 minutes.
name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button under the Actions tab

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the website
        run: |
          pip install -r requirements.txt
          python build.py

      - name: Upload to one.com
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          PORT: ${{ secrets.SFTP_PORT }}
          USERNAME: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          FOLDER: ${{ secrets.SFTP_FOLDER }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USERNAME" ] || [ -z "$LFTP_PASSWORD" ] || [ -z "$FOLDER" ]; then
            echo "Missing one.com connection details. Add SFTP_HOST, SFTP_USER, SFTP_PASSWORD and SFTP_FOLDER under Settings → Secrets and variables → Actions."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 30; set sftp:auto-confirm yes; \
            open --env-password -u \"$USERNAME\" -p ${PORT:-22} sftp://$HOST; \
            cd \"$FOLDER\"; \
            mirror --reverse --delete --verbose=1 --parallel=4 --exclude-glob videos/ public/ ./"
          echo "Published."

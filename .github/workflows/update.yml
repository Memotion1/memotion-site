# Applies website code updates that arrive as files in the "updates" folder,
# then publishes the site again. Nothing to do here by hand.
name: Apply website update

on:
  push:
    branches: [main]
    paths: ["updates/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply the update and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          parts=(updates/update-*-of-*.txt)
          if [ ${#parts[@]} -eq 0 ]; then echo "No update waiting."; exit 0; fi
          total=$(echo "${parts[0]}" | sed -E 's/.*-of-([0-9]+)\.txt/\1/')
          if [ ${#parts[@]} -lt "$total" ]; then echo "Waiting for the other parts (${#parts[@]} of $total)."; exit 0; fi
          for i in $(seq 1 "$total"); do cat "updates/update-$i-of-$total.txt"; done | tr -d ' \r\n' | tr '_-' '/+' > /tmp/update.b64
          base64 -d /tmp/update.b64 | xz -d > /tmp/update.patch
          git apply --verbose /tmp/update.patch
          git rm -q -r updates
          pip install -r requirements.txt
          SYNC_TEXTS=1 python build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build.py assets .pages.yml content
          git commit -m "Update website code"
          git push
          gh workflow run publish.yml --ref main
